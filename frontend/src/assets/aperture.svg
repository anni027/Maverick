<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" role="img" aria-label="Cyan aperture loader">
  <title>Aperture loader</title>
  <desc>Seven cyan blades spinning clockwise while the aperture breathes open and closed.</desc>
  <defs>
    <linearGradient id="bladeGradClean" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#e0f7ff"/>
    </linearGradient>
    <style>
      @keyframes spinClockwise {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      /* Aperture breathing: inward (contracting/closing iris) and outward (expanding/opening iris) */
      @keyframes apertureBreathe {
        0%, 100% { transform: scale(0.72) translate(0px, 18px); }
        50%      { transform: scale(1.16) translate(0px, -24px); }
      }
      .pinwheel-spin-rig {
        transform-origin: 250px 250px;
        animation: spinClockwise 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .aperture-blade {
        transform-origin: 0 0;
        animation: apertureBreathe 2.4s ease-in-out infinite;
      }
      /* Respect reduced-motion preferences when embedded in apps */
      @media (prefers-reduced-motion: reduce) {
        .pinwheel-spin-rig, .aperture-blade { animation: none; }
      }
    </style>
  </defs>

  <!-- Rotating aperture rig -->
  <g class="pinwheel-spin-rig">
    <g transform="translate(250, 250)">
      <g transform="rotate(0)"><g class="aperture-blade"><polygon fill="url(#bladeGradClean)" points="0,-46 44,-162 76,-88 18,-34"/></g></g>
      <g transform="rotate(51.4286)"><g class="aperture-blade"><polygon fill="url(#bladeGradClean)" points="0,-46 44,-162 76,-88 18,-34"/></g></g>
      <g transform="rotate(102.8571)"><g class="aperture-blade"><polygon fill="url(#bladeGradClean)" points="0,-46 44,-162 76,-88 18,-34"/></g></g>
      <g transform="rotate(154.2857)"><g class="aperture-blade"><polygon fill="url(#bladeGradClean)" points="0,-46 44,-162 76,-88 18,-34"/></g></g>
      <g transform="rotate(205.7143)"><g class="aperture-blade"><polygon fill="url(#bladeGradClean)" points="0,-46 44,-162 76,-88 18,-34"/></g></g>
      <g transform="rotate(257.1429)"><g class="aperture-blade"><polygon fill="url(#bladeGradClean)" points="0,-46 44,-162 76,-88 18,-34"/></g></g>
      <g transform="rotate(308.5714)"><g class="aperture-blade"><polygon fill="url(#bladeGradClean)" points="0,-46 44,-162 76,-88 18,-34"/></g></g>
    </g>
  </g>
</svg>
