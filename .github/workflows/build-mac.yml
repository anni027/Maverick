name: Build macOS App

on:
  workflow_dispatch: # Allows manual one-click trigger from the GitHub Actions tab
  push:
    branches:
      - master
      - main
      - feat/*
    paths:
      - 'crates/**'
      - 'frontend/**'
      - 'src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-mac.yml'
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build macOS (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: aarch64-apple-darwin
            name: Apple-Silicon
          - os: macos-13
            arch: x86_64-apple-darwin
            name: Intel
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Protoc (Protobuf Compiler)
        run: brew install protobuf

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend Assets
        run: |
          cd frontend
          npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build macOS DMG Bundle
        run: cargo tauri build --target ${{ matrix.arch }}

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maverick-macOS-${{ matrix.name }}-DMG
          path: |
            target/${{ matrix.arch }}/release/bundle/dmg/*.dmg
            target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Publish to GitHub Release (Tag Triggers Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.arch }}/release/bundle/dmg/*.dmg
            target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
