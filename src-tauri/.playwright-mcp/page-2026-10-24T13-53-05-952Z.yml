                      - generic [ref=f22e2216]:
                        - generic [ref=f22e2222]:
                          - paragraph [ref=f22e2223]: "Observations:"
                          - paragraph
                          - paragraph [ref=f22e2224]: 1. Processor is fast, no issues at all till now but I think you won't find that much difficulties even if you use lower model mobiles in regular usage.
                          - paragraph
                          - paragraph [ref=f22e2225]: 2. Giving 8 to 10 hours SOT which is common with any 7000mah battery. My usage is always 5g ON, dark theme, no games, normal day to day apps, watching movies.
                          - paragraph
                          - paragraph [ref=f22e2226]: 3. Screen is good with proper support for Dolby Vision in Netflix which is one of the major deciding factor for my purchase. Also, no lags in playing highest quality 4k videos in any apps.
                          - paragraph
                          - paragraph [ref=f22e2227]: 4. Photos are just ok ok but not clicked many. What I really not liked is the quality of zoomed photos lacking details and macro shots quality. However many reviews are positive on overall camera performance. I also used Gcam but default camera pictures are having more quality.
                          - paragraph
                          - paragraph [ref=f22e2228]: 5. Signal catching chip, I have seen only slight improvement over other mobiles in areas of poor signal but if you have good signal it is getting highest speeds like in Prime I got 138MBPS which is 1gbps.
                          - paragraph
                          - paragraph [ref=f22e2229]: 6. In hand feeling is good as it is curved backside but definitely not single hand friendly and also you will get pain for operating and holding it for long time as it is both lengthy at 162.42mm and heavy at 206g (with back cover 226g). Design is not that great and also I hate the big size of the backside camera module but I like the velvet feel of the back which is soothing, unfortunately with black cover which is of good quality provided by the company will suppress the feel.
                          - paragraph
                          - paragraph [ref=f22e2230]: 7. For normal tasks I have not seen any heating issues but if the signal is poor, using 5g for continuous downloads, at the time of charging it is getting very hot which is common for other mobiles too.
                          - paragraph
                          - paragraph [ref=f22e2231]: 8. OTG transfer speeds are not at all great as it has only USB 2.0 support. NFC available which is generally missing in many mobiles these days. Speaker direct output also seems to be not satisfactory in Prime video as music is interfering and suppressing voice, tried changing all available modes but no improvement. In other areas no issue faced regarding speaker.
                          - paragraph
                          - paragraph [ref=f22e2232]: 9. AI features are good and handy but we are still evolving to utilize to the max, I personally like double tap back to enable planner option. Also, there are many other useful features available.
                          - paragraph
                          - paragraph [ref=f22e2233]: 10. Sorry, I don't play games and hence not able to review on that aspect which is the main USP of this mobile. Kindly look into other sources.
                          - paragraph
                          - paragraph [ref=f22e2234]: However, I don't like the way brands not explicitly providing very important details these days even for this mobile...
                          - paragraph [ref=f22e2235]: a. SAR for head @1.173, body @0.628, limbs (new one not on box) @2.948W/kg
                          - paragraph [ref=f22e2236]: b. 4 OS updates, 6 years security updates*
                          - paragraph [ref=f22e2237]: c. Gorilla glass 7i protection on front
                          - paragraph
                          - paragraph [ref=f22e2238]: Even initial promotional reviews not shown the SAR which is a bad thing and also 7i protection is confirmed with company over email and *unfortunately no official confirmation is given by company on updates till date.
                          - paragraph
                          - paragraph [ref=f22e2239]: What I personally think about missing features are BT6.0, USB3.1 which might have made the mobile complete. GT 7T support BT6.0 but strangely a better processor mobile GT 7 supports only 5.4.
                          - paragraph
                          - paragraph [ref=f22e2240]: I bought this mobile with 1-year screen protection pre-booking promotional offer and at an effective price of Rs.35150 (39999-3000 card discount-1849 icici amazon pay cashback).
                          - paragraph
                          - paragraph [ref=f22e2241]: Finally, if it comes around 30000 then only try to have a look otherwise you can skip as we have other competitors like Oneplus 13R, Moto Edge 60 Pro and also Vivo T4 Ultra, Poco F7 in queue.
                          - paragraph
                          - paragraph [ref=f22e2242]: Used Realme X7 Max 12gb, 256gb for more than 3 years but due to issue at the time of transferring large number of files my mobile got corrupted. Even though I immediately went to Service centre but there was no luck in retrieving the lost data as it was encrypted. Hence, requesting all to backup your precious data on regular intervals.
                          - paragraph
                          - paragraph [ref=f22e2243]: "Suggestion: Always try to buy mobiles of 1 year old which will be available at most reasonable prices and if you buy them on festival or special sales you will get more price variation. Also, by that time you will get better idea about overall quality of the mobile with reasonable user reviews."
